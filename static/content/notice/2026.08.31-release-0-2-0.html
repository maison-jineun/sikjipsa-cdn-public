<h1>0.2.0 출시 노트</h1>
<p class="lead">화분이 3개에서 더 안 늘어나던 문제를 고쳤어요.</p>
<p>'광고 보고 화분 추가하기' 를 눌러도 광고가 뜨지 않고 그 자리에서 막혔어요. 이제 광고가 제대로 뜨고, 보고 나면 바로 추가돼요. 혹시 광고를 못 불러오더라도 다음번엔 기다리지 않게 미리 준비해 둬요.</p>
<p>그리고 앱이 어디서 불편한지 알 수 있도록, 어느 화면을 보셨는지 기록을 남기기 시작했어요. 화분 이름이나 적어 두신 내용은 담지 않아요.</p>

<section class="block block--note">
<p>앱은 다시 열면 저절로 최신이에요. 따로 받으실 것은 없어요.</p>
</section>
